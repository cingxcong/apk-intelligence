[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-intelligence"
version = "0.1.0"
description = "Evidence-first Android APK reverse engineering and DEX fingerprinting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
androguard = ["androguard>=4.1.4"]

[project.scripts]
apkintel = "apkintel.cli:main"

[tool.setuptools.packages.find]
include = ["apkintel*"]
