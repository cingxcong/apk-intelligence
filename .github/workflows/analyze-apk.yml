name: APK Intelligence

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: HTTPS URL of an APK you are authorized to analyze
        required: true
        type: string
      max_download_mb:
        description: Maximum download size in MB (10–250)
        required: true
        default: "250"
        type: string
      skip_optional_tools:
        description: Skip JADX, Apktool, and APKiD subprocess analysis
        required: true
        default: false
        type: boolean
      skip_androguard:
        description: Skip Androguard class/method extraction
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apk-analysis-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Java for Android tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Install Androguard
        if: ${{ !inputs.skip_androguard }}
        run: python -m pip install '.[androguard]'

      - name: Install APKiD
        if: ${{ !inputs.skip_optional_tools }}
        run: python -m pip install apkid

      - name: Run unit tests
        run: python -m pytest -q

      - name: Install optional reverse-engineering tools
        if: ${{ !inputs.skip_optional_tools }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apktool unzip
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request
          import zipfile

          api = "https://api.github.com/repos/skylot/jadx/releases/latest"
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "apk-intelligence-ci",
          }
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          release = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(api, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      release = json.load(response)
                  break
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                  print(f"JADX release lookup attempt {attempt}/3 failed: {exc}")
                  if attempt < 3:
                      time.sleep(2 ** attempt)

          if release is None:
              print("WARNING: Could not retrieve JADX release metadata; continuing without JADX.")
              raise SystemExit(0)

          asset = next((item for item in release.get("assets", []) if item["name"].endswith(".zip") and item["name"].startswith("jadx-")), None)
          if asset is None:
              print("WARNING: No JADX release ZIP found; continuing without JADX.")
              raise SystemExit(0)

          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "jadx"
          target.mkdir(parents=True, exist_ok=True)
          archive = target / "jadx.zip"
          download_request = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "apk-intelligence-ci"})
          try:
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(download_request, timeout=120) as response, archive.open("wb") as output:
                          output.write(response.read())
                      break
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                      print(f"JADX download attempt {attempt}/3 failed: {exc}")
                      if attempt == 3:
                          print("WARNING: Could not download JADX; continuing without JADX.")
                          raise SystemExit(0)
                      time.sleep(2 ** attempt)

              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(target)
          except zipfile.BadZipFile:
              print("WARNING: Downloaded JADX archive is invalid; continuing without JADX.")
              raise SystemExit(0)

          bins = [p for p in target.rglob("jadx") if p.is_file() and p.parent.name == "bin"]
          if not bins:
              print("WARNING: Could not locate JADX CLI; continuing without JADX.")
              raise SystemExit(0)
          bin_dir = bins[0].parent
          os.chmod(bins[0], 0o755)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(str(bin_dir) + "\n")
          print(f"Installed JADX from release {release.get('tag_name', 'unknown')}")
          PY
      - name: Validate download size input
        env:
          MAX_MB: ${{ inputs.max_download_mb }}
        run: |
          python - <<'PY'
          import os
          value = int(os.environ['MAX_MB'])
          if not 10 <= value <= 250:
              raise SystemExit('max_download_mb must be between 10 and 250')
          PY
      - name: Download and statically analyze APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          MAX_MB: ${{ inputs.max_download_mb }}
          SKIP_OPTIONAL_TOOLS: ${{ inputs.skip_optional_tools }}
          SKIP_ANDROGUARD: ${{ inputs.skip_androguard }}
        run: |
          args=(analyze-url "$APK_URL" --max-bytes "$((MAX_MB * 1024 * 1024))" --out analysis-output)
          if [ "$SKIP_OPTIONAL_TOOLS" = "true" ]; then
            args+=(--no-optional-tools)
          fi
          if [ "$SKIP_ANDROGUARD" = "true" ]; then
            args+=(--no-androguard)
          else
            args+=(--require-androguard)
          fi
          python -m apkintel "${args[@]}"
      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-intelligence-report-${{ github.run_id }}
          path: |
            analysis-output/**
            !analysis-output/sample.apk
            !analysis-output/input/sample.apk
            !analysis-output/**/*.apk
          if-no-files-found: warn
          retention-days: 7
