name: APK Intelligence

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: HTTPS URL of an APK you are authorized to analyze
        required: true
        type: string
      max_download_mb:
        description: Maximum download size in MB (10–250)
        required: true
        default: "250"
        type: string
      skip_optional_tools:
        description: Skip JADX, Apktool, and APKiD subprocess analysis
        required: true
        default: false
        type: boolean
      skip_androguard:
        description: Skip Androguard class/method extraction
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apk-analysis-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Java for Android tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Install Androguard
        if: ${{ !inputs.skip_androguard }}
        run: python -m pip install '.[androguard]'

      - name: Install APKiD
        if: ${{ !inputs.skip_optional_tools }}
        run: python -m pip install apkid

      - name: Run unit tests
        run: python -m pytest -q

      - name: Install optional reverse-engineering tools
        if: ${{ !inputs.skip_optional_tools }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apktool unzip
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          import zipfile

          api = "https://api.github.com/repos/skylot/jadx/releases/latest"
          request = urllib.request.Request(api, headers={"Accept": "application/vnd.github+json", "User-Agent": "apk-intelligence-ci"})
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          asset = next((item for item in release.get("assets", []) if item["name"].endswith(".zip") and item["name"].startswith("jadx-")), None)
          if asset is None:
              raise SystemExit("Could not find a JADX release ZIP asset")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "jadx"
          target.mkdir(parents=True, exist_ok=True)
          archive = target / "jadx.zip"
          download_request = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "apk-intelligence-ci"})
          with urllib.request.urlopen(download_request, timeout=120) as response, archive.open("wb") as output:
              output.write(response.read())
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(target)
          bins = [p for p in target.rglob("jadx") if p.is_file() and p.parent.name == "bin"]
          if not bins:
              sample = [str(p.relative_to(target)) for p in target.rglob("*") if p.is_file()][:30]
              raise SystemExit("Could not locate JADX CLI under a bin/ directory. Extracted files: " + ", ".join(sample))
          bin_dir = bins[0].parent
          os.chmod(bins[0], 0o755)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(str(bin_dir) + "\n")
          print(f"Installed JADX from release {release.get('tag_name', 'unknown')}")
          PY
      - name: Validate download size input
        env:
          MAX_MB: ${{ inputs.max_download_mb }}
        run: |
          python - <<'PY'
          import os
          value = int(os.environ['MAX_MB'])
          if not 10 <= value <= 250:
              raise SystemExit('max_download_mb must be between 10 and 250')
          PY
      - name: Download and statically analyze APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          MAX_MB: ${{ inputs.max_download_mb }}
          SKIP_OPTIONAL_TOOLS: ${{ inputs.skip_optional_tools }}
          SKIP_ANDROGUARD: ${{ inputs.skip_androguard }}
        run: |
          args=(analyze-url "$APK_URL" --max-bytes "$((MAX_MB * 1024 * 1024))" --out analysis-output)
          if [ "$SKIP_OPTIONAL_TOOLS" = "true" ]; then
            args+=(--no-optional-tools)
          fi
          if [ "$SKIP_ANDROGUARD" = "true" ]; then
            args+=(--no-androguard)
          fi
          python -m apkintel "${args[@]}"
      - name: Package analysis bundle
        if: always()
        run: |
          if [ -d analysis-output ]; then
            python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('analysis-output')
          with zipfile.ZipFile('apk-intelligence-report.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and p.name != 'sample.apk':
                      z.write(p, p.relative_to(root.parent))
          PY
          fi
      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-intelligence-report-${{ github.run_id }}
          path: |
            apk-intelligence-report.zip
            analysis-output/summary.md
            analysis-output/manifest.json
          if-no-files-found: warn
          retention-days: 7
